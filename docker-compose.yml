x-app-env: &app-env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/articles?sslmode=disable
  ELASTICSEARCH_URL: http://elasticsearch:9200

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: articles
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
      interval: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false" # local development only
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 5s
      retries: 40

  api:
    build: .
    command: ["api"]
    environment: *app-env
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  indexer:
    build: .
    command: ["indexer"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  # One-off: docker compose run --rm seed -articles 1000000
  seed:
    build: .
    entrypoint: ["seed"]
    environment: *app-env
    profiles: [tools]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  esdata:

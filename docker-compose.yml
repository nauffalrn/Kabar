x-app-env: &app-env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/articles?sslmode=disable
  ELASTICSEARCH_URL: http://elasticsearch:9200
  STORAGE_ENDPOINT: storage:8333
  STORAGE_ACCESS_KEY: kabar # local development only
  STORAGE_SECRET_KEY: kabar-secret

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: articles
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
      interval: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false" # local development only
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 5s
      retries: 40

  # S3-compatible object storage for article images (SeaweedFS).
  storage:
    image: chrislusf/seaweedfs:3.80
    command: ["server", "-ip.bind=0.0.0.0", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports: ["8333:8333"]
    volumes:
      - storagedata:/data
      - ./deploy/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro # local development credentials
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 3s
      retries: 30

  api:
    build: .
    command: ["api"]
    environment:
      <<: *app-env
      # Seeds the first admin; local development only.
      ADMIN_EMAIL: admin@kabar.local
      ADMIN_PASSWORD: admin12345
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      storage: { condition: service_healthy }

  web:
    build: ./web
    ports: ["3000:80"]
    depends_on: [api]

  indexer:
    build: .
    command: ["indexer"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  # One-off: docker compose run --rm seed -articles 1000000
  seed:
    build: .
    entrypoint: ["seed"]
    environment: *app-env
    profiles: [tools]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  esdata:
  storagedata:
